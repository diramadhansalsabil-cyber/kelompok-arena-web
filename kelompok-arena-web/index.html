<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B1220" />
    <title>Kelompok Arena</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="app">
      <section id="welcome" class="page page--welcome" aria-label="Beranda">
        <div class="welcome-inner">
          <h1>
            Selamat datang pada aplikasi<br />
            Kelompok Arena
          </h1>
          <button id="info-btn" class="btn-primary" type="button">
            informasi
          </button>
        </div>
      </section>

      <section
        id="members"
        class="page page--members is-hidden"
        aria-label="Daftar anggota"
      >
        <header class="members-header">
          <button
            id="back-btn"
            class="icon-btn"
            type="button"
            aria-label="Kembali"
          >
            ←
          </button>
          <h2>SEMUA ANGGOTA</h2>
          <span class="count">6/6</span>
        </header>

        <div
          id="avatar-row"
          class="avatar-row"
          role="tablist"
          aria-label="Pilih anggota"
        ></div>

        <div id="member-list" class="member-list" role="list"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
